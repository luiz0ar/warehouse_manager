services:
  postgreSQL:
    image: postgres:18-alpine
    container_name: warehouse_manager
    environment:
      POSTGRES_USER: "warehouse"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "warehouse_manager"
    ports:
      - "5432:5432"
    volumes:
      - postgreSQL:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: warehouse_manager_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: warehouse_manager_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://warehouse:root@postgreSQL:5432/warehouse_manager
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgreSQL:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    container_name: warehouse_manager_worker
    command: ["celery", "-A", "app.infrastructure.workers.celery_app.celery_app", "worker", "--loglevel=info", "-Q", "default,dead_letter", "-B"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://warehouse:root@postgreSQL:5432/warehouse_manager
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      postgreSQL:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgreSQL:
  redis: